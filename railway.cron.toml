# Config as Code, which Railway stops reading on 2026-12-01. .railway/railway.ts replaces it;
# delete this file only after cutover (docs/railway.md, "Before the first apply").

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.cron"

[deploy]
restartPolicyType = "NEVER"
# Hourly: /api/cron/daily runs each job when it is due (lib/cron-jobs.ts).
cronSchedule = "0 * * * *"
